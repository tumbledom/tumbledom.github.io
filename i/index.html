<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tumbledom</title>
<style>
  :root { --bg: #0b1030; --card: #1a1442; --gold: #ffcc4d; --text: #f3f1ff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: radial-gradient(circle at 50% 20%, #2a2068, var(--bg) 70%); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 3px solid var(--gold);
          border-radius: 24px; padding: 28px 22px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: .04em; color: var(--gold); }
  p { margin: 0 0 22px; line-height: 1.45; opacity: .9; }
  a.btn { display: inline-block; padding: 16px 28px; border-radius: 999px; background: #3fbf5a;
          color: #fff; font-weight: 700; font-size: 18px; text-decoration: none; }
  a.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>
<main class="card">
  <h1>TUMBLEDOM</h1>
  <p id="msg">Un ami t'invite à jouer avec lui !</p>
  <a class="btn" id="go" href="https://play.google.com/store/apps/details?id=com.lucas.gravisphere">Jouer sur Google Play</a>
</main>
<script>
  (function () {
    var c = new URLSearchParams(location.search).get("c") || "";
    if (!/^[A-Za-z0-9_-]{4,40}$/.test(c)) return;
    var store = "https://play.google.com/store/apps/details?id=com.lucas.gravisphere&referrer="
              + encodeURIComponent("invite=" + c);
    document.getElementById("go").href = store;
    location.replace(store);
  })();
</script>
</body>
</html>
